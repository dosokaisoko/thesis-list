// テーブル描画
function renderTable() {
  const tbody = document.querySelector("#thesisTable tbody");
  tbody.innerHTML = "";

  const term = document.getElementById("termFilter").value;
  const category = document.getElementById("categoryFilter").value;
  const keyword = document.getElementById("keywordBox").value.toLowerCase();

data
  .filter(row => {
    const selectedTerm = document.getElementById("termFilter").value;
    const selectedCategory = document.getElementById("categoryFilter").value;
    const keyword = document.getElementById("keywordBox").value.toLowerCase();

    // 期の完全一致判定
    const rowTermPrefix = row.term.split(" ")[0]; // "1期" の部分だけ

    return (
      (!selectedTerm || rowTermPrefix === selectedTerm) &&
      (!selectedCategory || row.category === selectedCategory) &&
      Object.values(row).some(v =>
        String(v).toLowerCase().includes(keyword)
      )
    );
  })
    .forEach(row => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${row.id}</td>
        <td>${row.term}</td>
        <td>${row.code}</td>
        <td>${row.title}</td>
        <td>${row.category}</td>
        <td>${row.subtitle}</td>
        <td>${row.members}</td>
      `;
      tbody.appendChild(tr);
    });
}

// イベント設定
document.getElementById("termFilter").addEventListener("change", renderTable);
document.getElementById("categoryFilter").addEventListener("change", renderTable);
document.getElementById("keywordBox").addEventListener("input", renderTable);

// 初期表示
